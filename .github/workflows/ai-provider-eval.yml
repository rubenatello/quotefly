name: Kody provider evaluation

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

jobs:
  evaluate:
    name: Synthetic provider-backed Kody quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quotefly_provider_eval_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quotefly_provider_eval_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quotefly_provider_eval_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/quotefly_provider_eval_test
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_ASSISTANT_MODEL: gpt-4o-mini
      OPENAI_ASSISTANT_TIMEOUT_MS: "12000"
      OPENAI_COST_INPUT_PER_1M_USD: "0.15"
      OPENAI_COST_OUTPUT_PER_1M_USD: "0.60"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require the provider evaluation secret
        run: test -n "$OPENAI_API_KEY" || { echo "Repository secret OPENAI_API_KEY is required."; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated provider evaluation database
        run: |
          npm run prisma:generate
          npm run prisma:migrate:deploy

      - name: Run synthetic Kody provider evaluation
        run: |
          set -o pipefail
          npm run eval:assistant:provider | tee kody-provider-eval.json

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kody-provider-eval-${{ github.run_id }}
          path: kody-provider-eval.json
          if-no-files-found: error
          retention-days: 30
