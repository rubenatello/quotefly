name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quotefly_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quotefly_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      QBO_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quotefly_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quotefly_test?schema=public
      TEST_RATE_LIMIT_REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-jwt-secret-for-quotefly-builds-at-least-32-chars
      APP_URL: http://localhost:5173
      API_URL: http://localhost:4000
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      E2E_API_PORT: 4100
      E2E_WEB_PORT: 4173
      E2E_API_URL: http://127.0.0.1:4100
      E2E_WEB_URL: http://127.0.0.1:4173
      SESSION_COOKIE_NAME: qf_session
      SESSION_COOKIE_DOMAIN: ""
      SESSION_COOKIE_SAME_SITE: lax
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4o-mini
      SUPERUSER_EMAILS: superuser-e2e@example.com
      STRIPE_SECRET_KEY: sk_test_quotefly_ci
      STRIPE_WEBHOOK_SECRET: whsec_quotefly_ci
      STRIPE_PRICE_ID_STARTER: price_test_starter
      STRIPE_COUPON_ID_BASIC_FIRST_MONTH_HALF_OFF: quotefly_basic_first_month_half_off
      STRIPE_PRICE_ID_PROFESSIONAL: price_test_professional
      STRIPE_PRICE_ID_ENTERPRISE: price_test_enterprise
      QUICKBOOKS_ENVIRONMENT: sandbox
      ENABLE_TWILIO_SMS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$QBO_CANDIDATE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Verify launch readiness
        run: npm run verify:launch

      - name: Build exact-candidate standalone QuickBooks watchdog
        run: docker build --platform linux/amd64 --label org.opencontainers.image.revision="$QBO_CANDIDATE_SHA" -f ops/quickbooks-watchdog/Dockerfile -t quotefly-qbo-watchdog:local-ci-${{ github.run_id }} .

      - name: Prove standalone watchdog crash recovery and exclusion
        run: node scripts/quickbooks-watchdog-container-test.mjs quotefly-qbo-watchdog:local-ci-${{ github.run_id }}

      - name: Record reviewed watchdog image identity
        run: |
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' quotefly-qbo-watchdog:local-ci-${{ github.run_id }})" = "$QBO_CANDIDATE_SHA"
          docker image inspect --format 'Watchdog image ID {{.Id}} revision {{index .Config.Labels "org.opencontainers.image.revision"}}' quotefly-qbo-watchdog:local-ci-${{ github.run_id }}

      - name: Scan exact watchdog image with pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d "$RUNNER_TEMP/qbo-image-scan.XXXXXX")"
          curl --fail --show-error --silent --location --proto '=https' --proto-redir '=https' --max-time 120 \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output "$scan_dir/trivy.tar.gz"
          SCANNER_ARCHIVE="$scan_dir/trivy.tar.gz" node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { createHash } from "node:crypto";
            const actual = createHash("sha256").update(readFileSync(process.env.SCANNER_ARCHIVE)).digest("hex");
            if (actual !== "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a") process.exit(1);
          '
          tar -xzf "$scan_dir/trivy.tar.gz" -C "$scan_dir" trivy
          docker image save --output "$scan_dir/image.tar" quotefly-qbo-watchdog:local-ci-${{ github.run_id }}
          "$scan_dir/trivy" image --input "$scan_dir/image.tar" --scanners vuln --pkg-types os,library \
            --ignorefile /dev/null --ignore-unfixed=false --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --format json --output "$scan_dir/results.json" --cache-dir "$scan_dir/cache" \
            --timeout 10m --skip-version-check --quiet
          "$scan_dir/trivy" --version --cache-dir "$scan_dir/cache"
          sha256sum "$scan_dir/image.tar" "$scan_dir/results.json"
          image_id="$(docker image inspect --format '{{.Id}}' quotefly-qbo-watchdog:local-ci-${{ github.run_id }})"
          node scripts/quickbooks-image-archive.mjs "$scan_dir/image.tar" \
            quotefly-qbo-watchdog:local-ci-${{ github.run_id }} "$image_id" >/dev/null
          echo QBO_IMAGE_ARCHIVE_EVIDENCE_VALID
          node scripts/quickbooks-image-scan-policy.mjs "$scan_dir/results.json" "$scan_dir/cache/db/metadata.json" \
            "$scan_dir/image.tar" quotefly-qbo-watchdog:local-ci-${{ github.run_id }} "$image_id" \
            docs/security/quickbooks-watchdog-image-dispositions.json
